# Collapsed vs traversal ablation (M4): RAPTOR tree traversal. From the roots down, keep the top
# traversal_k nodes per layer by cosine similarity and descend to their children; rank all selected nodes.
run:
  name: tree_traversal
retrieval:
  mode: dense_ivf
  tree_search: traversal
  traversal_k: 5
  levels: [0, 1, 2, 3, 4]
raptor:
  enabled: true
