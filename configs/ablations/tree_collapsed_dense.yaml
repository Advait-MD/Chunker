# Collapsed vs traversal ablation (M4), dense side: collapsed-tree search with dense retrieval only,
# so it compares like for like with tree traversal (which ranks by cosine, as in the RAPTOR paper).
run:
  name: tree_collapsed_dense
retrieval:
  mode: dense_ivf
  dense_backend: flat
  levels: [0, 1, 2, 3, 4]
raptor:
  enabled: true
